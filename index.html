<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rừng Số Vui</title>
  <style>
    :root {
      --bg1: #dff7ff;
      --bg2: #b4f0c9;
      --card: #ffffff;
      --ink: #27365a;
      --green: #57c97b;
      --yellow: #ffd760;
      --pink: #ff8d7d;
      --blue: #75b9ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Baloo 2", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--ink);
    }
    .container {
      width: min(92vw, 560px);
      background: rgba(255,255,255,0.45);
      border: 4px solid rgba(39,54,90,0.12);
      border-radius: 30px;
      box-shadow: 0 12px 0 rgba(39,54,90,0.12);
      padding: 28px 20px 22px;
      text-align: center;
    }
    .emoji {
      font-size: 78px;
      margin-bottom: 8px;
      animation: float 2.2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
    }
    p {
      margin: 0 0 22px;
      font-size: 1.3rem;
      font-weight: 700;
    }
    .start-btn {
      display: inline-block;
      text-decoration: none;
      background: var(--yellow);
      color: var(--ink);
      border-radius: 24px;
      padding: 16px 28px;
      font-size: 1.5rem;
      font-weight: 800;
      box-shadow: 0 8px 0 rgba(39,54,90,0.18);
      transition: transform 0.12s ease;
    }
    .start-btn:hover {
      transform: translateY(-2px);
    }
    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 rgba(39,54,90,0.18);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🦊🌳</div>
    <h1>Rừng Số Vui</h1>
    <p>Chào bé! Hôm nay chúng ta cùng học toán thật vui nhé!</p>
    <a class="start-btn" href="be-hoc-toan.html">Bắt đầu học</a>
  </div>
</body>
</html>
