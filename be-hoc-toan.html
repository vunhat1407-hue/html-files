<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé Học Toán – Rừng Số Vui</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#CDEFF7;--bg2:#A8E0C0;--card:#fff;--ink:#27365A;--g:#4DBB6A;--y:#FFD23F;--c:#FF7B6B;--b:#5AA7F5;--p:#B58CF5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C2B4A;--bg2:#1F4A3A;--card:#2A3B63;--ink:#F3F6FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C2B4A;--bg2:#1F4A3A;--card:#2A3B63;--ink:#F3F6FF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(var(--bg),var(--bg2)) fixed;color:var(--ink);font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;font-weight:500;font-size:20px}
#app{max-width:560px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pill{background:var(--card);border-radius:99px;padding:4px 14px;font-weight:800;box-shadow:0 3px 0 #0002}
.btn{border:0;border-radius:22px;font:inherit;font-weight:800;color:#27365A;cursor:pointer;box-shadow:0 6px 0 #0003;transition:transform .1s;min-height:64px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
:focus-visible{outline:4px solid #27365A;outline-offset:3px}
.small{min-height:44px;padding:4px 14px;border-radius:99px;font-size:18px;background:var(--card);color:var(--ink)}
.hero{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.fox{font-size:76px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.fox.hop{animation:hop .5s}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes hop{40%{transform:translateY(-26px) rotate(-8deg)}}
.bubble{background:var(--card);border-radius:22px 22px 22px 6px;padding:10px 16px;font-size:22px;font-weight:700;flex:1;box-shadow:0 4px 0 #0002}
h1{font-size:34px;line-height:1.1;margin:0 0 4px;font-weight:800}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg .btn{flex:1;min-height:48px;font-size:18px;background:var(--card);color:var(--ink);box-shadow:0 4px 0 #0002}
.seg .btn.on{background:var(--y);color:#27365A;outline:3px solid #27365A}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 8px;min-height:120px;font-size:22px}
.mode b{font-size:44px;line-height:1.1}
.mode:last-child:nth-child(odd){grid-column:1/-1}
.dots{display:flex;gap:5px;flex:1;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--card);opacity:.6}
.dots i.d{background:var(--g);opacity:1}.dots i.cur{opacity:1;outline:3px solid var(--ink)}
.card{background:var(--card);border-radius:28px;padding:18px 14px;text-align:center;box-shadow:0 6px 0 #0002;margin-bottom:18px}
.ask{font-size:24px;font-weight:800;margin:0 0 8px}
.pics{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:38px;line-height:1.15;margin:6px 0}
.pics span{animation:pop .35s both}
@keyframes pop{from{transform:scale(0)}}
.eq{font-size:56px;font-weight:800;letter-spacing:2px}
.eq .q{display:inline-block;min-width:1.1em;border-bottom:5px dashed var(--c);color:var(--c)}
.seq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seq b{min-width:54px;padding:8px 6px;border-radius:16px;background:var(--y);color:#27365A;font-size:38px}
.seq b.q{background:transparent;border:4px dashed var(--c);color:var(--c)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{font-size:44px;padding:6px}
.opt small{display:block;font-size:16px;font-weight:700;margin-top:-6px}
.opt:disabled{opacity:.35;transform:none;box-shadow:none}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.opt.t{font-size:26px;min-height:72px}
.item{width:104px;padding:6px 4px 8px;border-radius:16px;background:#FFF8E1;color:#27365A;border:3px solid #27365A44;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.item span{font-size:44px}.item b{font-size:24px}.item small{font-size:14px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips .btn{min-width:52px;box-shadow:0 3px 0 #0002}
.btn.small.on{background:var(--y);color:#27365A;outline:3px solid #27365A}
.notes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.note{width:120px;height:64px;border-radius:10px;border:3px solid #27365A66;color:#27365A;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.note b{font-size:24px}.note small{font-size:14px;font-weight:700}
.big{font-size:84px;text-align:center;letter-spacing:6px;margin:6px 0}
.conf{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const ICONS=['🍎','🐥','⭐','🍓','🐟','🎈','🍄','🦋','🥕','🐞'];
const COLS=['y','g','c','b'];
const MODES={count:['Đếm số','🍎'],add:['Phép cộng','➕'],add20:['Cộng đến 20','🧮'],sub:['Phép trừ','➖'],cmp:['So sánh','⚖️'],seq:['Số còn thiếu','🔢'],clock:['Xem đồng hồ','🕐'],clock5:['Giờ và phút','⏰'],money:['Tiền Việt Nam','💵'],shop:['Mua hàng','🛒'],bond:['Tách và gộp số','🧩']};
const mOpts=t=>{const s=new Set([t]);while(s.size<4){const v=t+R(-3,3);if(v>=1)s.add(v)}return shuffle([...s]).map(v=>({v,l:`${v}.000 đồng`}))};
const pt=(a,l)=>[100+l*Math.sin(a*Math.PI/180),100-l*Math.cos(a*Math.PI/180)];
function clockSvg(h,m){let n='';for(let i=1;i<=12;i++){const[x,y]=pt(i*30,74);n+=`<text x="${x}" y="${y+8}" text-anchor="middle" font-size="22" font-weight="800" fill="#27365A">${i}</text>`}const[hx,hy]=pt((h%12)*30+m/2,44),[mx,my]=pt(m*6,68);return `<svg viewBox="0 0 200 200" width="230" height="230" role="img" aria-label="Đồng hồ"><circle cx="100" cy="100" r="96" fill="#FFF8E1" stroke="#FF7B6B" stroke-width="8"/>${n}<line x1="100" y1="100" x2="${hx}" y2="${hy}" stroke="#27365A" stroke-width="9" stroke-linecap="round"/><line x1="100" y1="100" x2="${mx}" y2="${my}" stroke="#FF7B6B" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="#27365A"/></svg>`}
const S={max:10,mode:'',q:0,score:0,cur:null,miss:false,voice:true,stars:0};
try{S.stars=+localStorage.getItem('bhm_stars')||0}catch(e){}

let ac;
function tone(f,d=.15,t=0){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.15,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}catch(e){}}
function say(t){if(!S.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<26;i++){const s=document.createElement('span');s.className='conf';s.textContent=pick(['🎉','⭐','🎈','✨','🌟']);s.style.left=R(0,95)+'vw';s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=Math.random()+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}}

const pics=(n,ic)=>'<div class="pics">'+Array.from({length:n},(_,i)=>`<span style="animation-delay:${i*40}ms">${ic}</span>`).join('')+'</div>';
function numOpts(ans,max){const s=new Set([ans]);while(s.size<4){const v=ans+R(-3,3);if(v>=0&&v<=max)s.add(v)}return shuffle([...s]).map(v=>({v,l:v}))}

function makeQ(){
  const m=S.mode,max=S.max,ic=pick(ICONS);
  if(m==='count'){const n=R(1,max);return{ask:'Có bao nhiêu hình?',say:'Bé hãy đếm xem có bao nhiêu hình nào?',html:pics(n,ic),ans:n,opts:numOpts(n,max)}}
  if(m==='add'){const a=R(0,max),b=R(0,max-a);return{ask:'Tính nhé!',say:`${a} cộng ${b} bằng mấy?`,html:(max<=10?pics(a,ic)+pics(b,pick(ICONS)): '')+`<div class="eq">${a} + ${b} = <span class="q">?</span></div>`,ans:a+b,opts:numOpts(a+b,max)}}
  if(m==='sub'){const a=R(1,max),b=R(0,a);return{ask:'Tính nhé!',say:`${a} trừ ${b} bằng mấy?`,html:`<div class="eq">${a} − ${b} = <span class="q">?</span></div>`,ans:a-b,opts:numOpts(a-b,max)}}
  if(m==='cmp'){let a=R(0,max),b=Math.random()<.2?a:R(0,max);const ans=a>b?'>':a<b?'<':'=';return{ask:'Chọn dấu thích hợp',say:`${a} so với ${b}. Bé chọn dấu nào?`,html:`<div class="eq">${a} <span class="q">&nbsp;</span> ${b}</div>`,ans,opts:[{v:'<',l:'<',s:'bé hơn'},{v:'=',l:'=',s:'bằng'},{v:'>',l:'>',s:'lớn hơn'}],three:1}}
  if(m==='bond'){const t=R(3,max),a=R(1,t-1),b=t-a,sm=t<=10,gb='<button class="btn small" onclick="guide()" style="margin-top:8px">📖 Xem hướng dẫn</button>';if(Math.random()<.6){const[x,y]=Math.random()<.5?[a,b]:[b,a];return{ask:`Số ${t} gồm ${x} và mấy?`,say:`Số ${t} gồm ${x} và mấy?`,html:bondSvg(t,x,null)+(sm?pics(t,ic):'')+'<br>'+gb,ans:y,opts:numOpts(y,max)}}return{ask:`${a} và ${b} gộp lại được mấy?`,say:`${a} và ${b} gộp lại được mấy?`,html:bondSvg(null,a,b)+(sm?pics(a,ic)+pics(b,pick(ICONS)):'')+'<br>'+gb,ans:t,opts:numOpts(t,max)}}
  if(m==='clock5'){const M=[5,10,15,20,25,35,40,45,50,55],h=R(1,12),mi=pick(M),L=(x,y)=>`${x} giờ ${y} phút`,ans=L(h,mi),s=new Set([ans,L(h,pick(M.filter(v=>v!==mi))),L(h%12+1,mi)]);while(s.size<4)s.add(L(R(1,12),pick(M)));return{ask:'Đồng hồ chỉ mấy giờ, mấy phút?',say:'Đồng hồ chỉ mấy giờ, mấy phút nhỉ?',html:clockSvg(h,mi)+'<p style="margin:4px 0 0;font-size:17px">Kim ngắn chỉ giờ. Kim dài chỉ phút: mỗi số là 5 phút.</p>',ans,txt:1,opts:shuffle([...s]).map(v=>({v,l:v}))}}
  if(m==='shop'){const it=shuffle([['🍦','kem'],['🍌','chuối'],['🧃','nước ép'],['✏️','bút chì'],['📒','vở'],['🍪','bánh quy'],['🎈','bóng bay']]),tag=(i,p)=>`<div class="item"><span>${i[0]}</span><b>${p}.000</b><small>đồng</small></div>`;if(Math.random()<.5){const p=R(1,9),pay=pick([5,10,20].filter(x=>x>p)),cl={5:'#8DBCEB',10:'#E3C77E',20:'#6FA3D9'};return{ask:'Tiền thối lại là bao nhiêu?',say:`Mua ${it[0][1]} giá ${p} nghìn đồng. Java đưa tờ ${pay} nghìn đồng. Cô bán hàng trả lại bao nhiêu tiền?`,html:`<div class="notes">${tag(it[0],p)}</div><p class="ask">Java đưa tờ</p><div class="notes"><div class="note" style="background:${cl[pay]}"><b>${pay}.000</b><small>đồng</small></div></div>`,ans:pay-p,txt:1,opts:mOpts(pay-p)}}const p1=R(1,9),p2=R(1,Math.min(9,20-p1));return{ask:'Mua hai món hết bao nhiêu tiền?',say:`Mua ${it[0][1]} giá ${p1} nghìn đồng và ${it[1][1]} giá ${p2} nghìn đồng. Hết tất cả bao nhiêu tiền?`,html:`<div class="notes">${tag(it[0],p1)}<b style="font-size:40px;align-self:center">+</b>${tag(it[1],p2)}</div>`,ans:p1+p2,txt:1,opts:mOpts(p1+p2)}}
  if(m==='add20'){const a=R(2,18),b=R(1,20-a);return{ask:'Cộng đến 20',say:`${a} cộng ${b} bằng mấy?`,html:`<div class="eq">${a} + ${b} = <span class="q">?</span></div>`,ans:a+b,opts:numOpts(a+b,20)}}
  if(m==='clock'){const h=R(1,12),half=Math.random()<.35,L=(x,f)=>f?`${x} giờ rưỡi`:`${x} giờ`,ans=L(h,half),s=new Set([ans,L(h,!half),L(h%12+1,half)]);while(s.size<4)s.add(L(R(1,12),Math.random()<.35));return{ask:'Đồng hồ chỉ mấy giờ?',say:'Đồng hồ chỉ mấy giờ nhỉ?',html:clockSvg(h,half?30:0),ans,txt:1,opts:shuffle([...s]).map(v=>({v,l:v}))}}
  if(m==='money'){const cols={1:'#D9C7A8',2:'#B8C4B8',5:'#8DBCEB',10:'#E3C77E'};let ns=[],t=0;for(let i=R(2,3);i>0;i--){const d=pick([1,2,5,10]);if(t+d<=20){ns.push(d);t+=d}}if(ns.length<2){ns=[5,2];t=7}ns.sort((x,y)=>y-x);const s=new Set([t]);while(s.size<4){const v=t+R(-3,3);if(v>=1)s.add(v)}return{ask:'Có bao nhiêu tiền?',say:'Bé cộng các tờ tiền xem được bao nhiêu đồng nhé?',html:'<div class="notes">'+ns.map(d=>`<div class="note" style="background:${cols[d]}"><b>${d}.000</b><small>đồng</small></div>`).join('')+'</div>',ans:t,txt:1,opts:shuffle([...s]).map(v=>({v,l:`${v}.000 đồng`}))}}
  const st=R(0,max-4),h=R(0,4),ans=st+h;
  return{ask:'Điền số còn thiếu',say:'Bé điền số còn thiếu vào dãy số nhé!',html:'<div class="seq">'+[0,1,2,3,4].map(i=>i===h?'<b class="q">?</b>':`<b>${st+i}</b>`).join('')+'</div>',ans,opts:numOpts(ans,max)}
}

function home(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="top"><h1>Rừng Số Vui</h1><span class="pill">⭐ ${S.stars}</span></div>
  <div class="hero"><div class="fox">🦊</div><div class="bubble">Chào bé Java! Hôm nay mình học toán nhé!</div></div>
  <div class="seg" role="group" aria-label="Chọn phạm vi"><button class="btn ${S.max===10?'on':''}" data-r="10">Trong phạm vi 10</button><button class="btn ${S.max===20?'on':''}" data-r="20">Trong phạm vi 20</button></div>
  <div class="grid">${Object.entries(MODES).map(([k,[n,e]],i)=>`<button class="btn mode" style="background:var(--${COLS[i%4]==='y'?'y':COLS[i%4]})" data-m="${k}"><b>${e}</b>${n}</button>`).join('')}</div>`;
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.max=+b.dataset.r;tone(520);home()});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.q=0;S.score=0;tone(660);S.mode==='bond'?guide():next()});
}

function bondSvg(t,a,b){const c=(x,y,f,v)=>`<circle cx="${x}" cy="${y}" r="30" fill="${f}" stroke="#27365A" stroke-width="3"/><text x="${x}" y="${y+11}" text-anchor="middle" font-size="32" font-weight="800" fill="${v==null?'#C23B2B':'#27365A'}">${v==null?'?':v}</text>`;return `<svg viewBox="0 0 220 170" width="230" height="178" role="img" aria-label="Sơ đồ tách gộp số"><line x1="110" y1="64" x2="55" y2="108" stroke="#27365A" stroke-width="4"/><line x1="110" y1="64" x2="165" y2="108" stroke="#27365A" stroke-width="4"/>${c(110,36,'#FFD23F',t)}${c(55,134,'#7BD28E',a)}${c(165,134,'#FF9C8F',b)}</svg>`}
const G={n:6,a:3};
function guide(){
  const app=document.getElementById('app'),{n,a}=G,b=n-a;
  app.innerHTML=`<div class="top"><button class="btn small" id="back">🏠 Về nhà</button><span class="pill">📖 Hướng dẫn</span></div>
  <div class="hero"><div class="fox">🦊</div><div class="bubble">Java ơi, mình cùng học tách và gộp số nhé!</div></div>
  <div class="card"><p class="ask">1. Chọn một số để tách</p><div class="chips">${[3,4,5,6,7,8,9,10].map(x=>`<button class="btn small ${x===n?'on':''}" data-n="${x}">${x}</button>`).join('')}</div></div>
  <div class="card"><p class="ask">2. Tách: ${n} gồm ${a} và ${b}</p>${bondSvg(n,a,b)}${pics(a,'🍎')}${pics(b,'🍏')}<p class="ask" style="font-size:18px">Bấm số để tách theo cách khác:</p><div class="chips">${Array.from({length:n-1},(_,i)=>i+1).map(x=>`<button class="btn small ${x===a?'on':''}" data-a="${x}">${x}</button>`).join('')}</div></div>
  <div class="card"><p class="ask">3. Gộp: ${a} và ${b} gộp lại được ${n}</p><div class="eq" style="font-size:44px">${a} + ${b} = ${n}</div></div>
  <button class="btn opt" style="background:var(--g);font-size:26px;width:100%" id="go">Chơi thôi!</button>`;
  document.getElementById('back').onclick=home;
  document.getElementById('go').onclick=()=>{S.mode='bond';S.q=0;S.score=0;tone(660);next()};
  app.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>{G.n=+x.dataset.n;G.a=Math.max(1,Math.floor(G.n/2));tone(520);guide();say(`${G.n} gồm ${G.a} và ${G.n-G.a}`)});
  app.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{G.a=+x.dataset.a;tone(580);guide();say(`${G.n} gồm ${G.a} và ${G.n-G.a}`)});
}
function next(){
  if(S.q>=10)return result();
  S.cur=makeQ();S.miss=false;
  const c=S.cur,app=document.getElementById('app');
  app.innerHTML=`<div class="top"><button class="btn small" id="back">🏠 Về nhà</button><div class="dots" aria-label="Câu ${S.q+1} trên 10">${Array.from({length:10},(_,i)=>`<i class="${i<S.q?'d':i===S.q?'cur':''}"></i>`).join('')}</div><button class="btn small" id="vo" aria-label="Bật tắt giọng đọc">${S.voice?'🔊':'🔇'}</button></div>
  <div class="hero"><div class="fox" id="fox">🦊</div><div class="bubble" id="msg">${c.ask}</div></div>
  <div class="card">${c.html}<button class="btn small" id="rd" style="margin-top:8px">🔊 Nghe câu hỏi</button></div>
  <div class="opts ${c.three?'three':''}">${c.opts.map((o,i)=>`<button class="btn opt ${c.txt?'t':''}" style="background:var(--${COLS[i%4]})" data-v="${o.v}">${o.l}${o.s?`<small>${o.s}</small>`:''}</button>`).join('')}</div>`;
  document.getElementById('back').onclick=()=>{speechSynthesis&&speechSynthesis.cancel();home()};
  document.getElementById('vo').onclick=e=>{S.voice=!S.voice;e.target.textContent=S.voice?'🔊':'🔇';if(S.voice)say(c.say)};
  document.getElementById('rd').onclick=()=>{const v=S.voice;S.voice=true;say(c.say);S.voice=v};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
  say(c.say);
}

function answer(b){
  const c=S.cur,msg=document.getElementById('msg'),fox=document.getElementById('fox');
  if(String(c.ans)===b.dataset.v){
    if(!S.miss)S.score++;
    tone(660);tone(880,.2,.12);
    fox.classList.add('hop');
    const t=pick(['Java giỏi quá!','Đúng rồi!','Tuyệt vời!','Java làm tốt lắm!']);
    msg.textContent=t;say(t);
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    S.q++;setTimeout(next,1300);
  }else{
    S.miss=true;tone(220,.25);
    b.disabled=true;b.classList.add('shake');
    msg.textContent='Chưa đúng, Java thử lại nhé!';
  }
}

function result(){
  const st=S.score>=9?3:S.score>=6?2:1;
  S.stars+=st;try{localStorage.setItem('bhm_stars',S.stars)}catch(e){}
  confetti();tone(523,.15);tone(659,.15,.15);tone(784,.3,.3);
  const t=st===3?'Java giỏi xuất sắc!':st===2?'Java làm rất tốt!':'Cố gắng lên nhé, Java sẽ giỏi hơn!';
  say(t);
  document.getElementById('app').innerHTML=`<div class="top"><h1>Kết quả</h1><span class="pill">⭐ ${S.stars}</span></div>
  <div class="hero"><div class="fox hop">🦊</div><div class="bubble">${t}</div></div>
  <div class="card"><div class="big">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><p class="ask">Đúng ngay lần đầu: ${S.score}/10 câu</p></div>
  <div class="opts"><button class="btn opt" style="background:var(--g);font-size:26px" id="again">Chơi lại</button><button class="btn opt" style="background:var(--y);font-size:26px" id="home">Chọn bài khác</button></div>`;
  document.getElementById('again').onclick=()=>{S.q=0;S.score=0;next()};
  document.getElementById('home').onclick=home;
}
home();
</script>
</body>
</html>
